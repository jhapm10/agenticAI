<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Input</title>
</head>
<body>
<h1>Enter Task for Site Validation</h1>
<form action="/submit-task" method="post">
    <label for="task">Task:</label><br>
    <textarea id="task" name="task" rows="4" cols="50" placeholder="Enter your task here..."></textarea><br><br>
    <button type="submit">Submit</button>
</form>
</body>
</html>
